logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:DB_META_HOST,localhost}
  port: ${oc.env:DB_META_PORT,3306}
  user: ${oc.env:DB_META_USER,datapilot}
  password: ${oc.env:DB_META_PASSWORD,datapilot_password}
  database: meta

db_dw:
  host: ${oc.env:DB_DW_HOST,localhost}
  port: ${oc.env:DB_DW_PORT,3306}
  user: ${oc.env:DB_DW_USER,datapilot}
  password: ${oc.env:DB_DW_PASSWORD,datapilot_password}
  database: dw

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: 1024

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: BAAI/bge-large-zh-v1.5

es:
  host: ${oc.env:ES_HOST,localhost}
  port: ${oc.env:ES_PORT,9200}
  index_name: data_agent

llm:
  model_name: ${oc.env:LLM_MODEL,llama-3.3-70b-versatile}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL,https://api.groq.com/openai/v1}
