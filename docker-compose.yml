services:
  datapilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-Pro/zai-org/GLM-5.1}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - ENABLE_EXTERNAL_SERVICES=${ENABLE_EXTERNAL_SERVICES:-false}
      - DB_DW_HOST=mysql
      - DB_DW_PORT=3306
      - DB_DW_USER=datapilot
      - DB_DW_PASSWORD=${MYSQL_PASSWORD:-datapilot_password}
      - DB_DW_DATABASE=dw
      - DB_META_HOST=mysql
      - DB_META_PORT=3306
      - DB_META_USER=datapilot
      - DB_META_PASSWORD=${MYSQL_PASSWORD:-datapilot_password}
      - DB_META_DATABASE=meta
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - EMBEDDING_HOST=embedding
      - EMBEDDING_PORT=8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: datapilot-mysql
    restart: unless-stopped
    profiles: ["infra", "full"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-datapilot_root_pass}
      MYSQL_USER: ${MYSQL_USER:-datapilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-datapilot_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  elasticsearch:
    build: ./docker/elasticsearch
    container_name: datapilot-elasticsearch
    restart: unless-stopped
    profiles: ["infra", "full"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: datapilot-qdrant
    restart: unless-stopped
    profiles: ["infra", "full"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  es_data:
  qdrant_data:

